<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Easy step-by-step DIY home improvement guides with illustrations, photos, videos and building-code checks for your region.">
<meta name="theme-color" content="#1D2530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Level &amp; Plumb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop manual — trade index rail on the left, a graph-paper drawing board beside a numbered step list. */
:root{
  --bg:#F2F3EE; --panel:#FFFFFF; --panel2:#E6E9E2; --ink:#1D2530; --muted:#5A6472; --line:#C9CEC9;
  --accent:#D9531B; --accent-soft:#F8D9C8; --blue:#2C5FB8; --blue-soft:#DCE6F7;
  --caution:#F3C433; --caution-soft:#FBF0C9; --green:#2E8B4E; --grid:#DCE0DA;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161B; --panel:#1A2028; --panel2:#252D37; --ink:#E5E9EE; --muted:#9AA5B2; --line:#33404D;
  --accent:#FF7B42; --accent-soft:#4A2A1C; --blue:#86AEF5; --blue-soft:#1E2C44;
  --caution:#F3C433; --caution-soft:#3A3217; --green:#5CC983; --grid:#202832; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161B; --panel:#1A2028; --panel2:#252D37; --ink:#E5E9EE; --muted:#9AA5B2; --line:#33404D;
  --accent:#FF7B42; --accent-soft:#4A2A1C; --blue:#86AEF5; --blue-soft:#1E2C44;
  --caution:#F3C433; --caution-soft:#3A3217; --green:#5CC983; --grid:#202832; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.05;margin:0;letter-spacing:.01em}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 60px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:700 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.search{margin-left:auto;flex:1 1 260px;max-width:380px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;margin-top:24px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 40px);overflow:auto}
.rail h4{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:5px;text-decoration:none;color:var(--ink);font-weight:500}
.rail a:hover{background:var(--panel2)}
.rail a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.rail a span{font:400 11px var(--mono);color:inherit;opacity:.6;align-self:center}
main{min-width:0}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:28px}
.intro h1{font-size:clamp(40px,6vw,68px);text-transform:uppercase}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p{margin:0;color:var(--muted);max-width:52ch}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.chip.permit{border-color:var(--caution);background:var(--caution-soft)}
.chip.code{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .thumb{background:var(--panel2);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;padding:10px 14px;border-bottom:1.5px solid var(--line)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .kicker{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card h3{font-size:24px;text-transform:uppercase}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card .foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.bar{height:4px;background:var(--panel2);border-radius:4px;overflow:hidden;width:70px}
.bar i{display:block;height:100%;background:var(--green)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:8px}

/* guide */
.crumb{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--muted)}
.guide-head h1{font-size:clamp(34px,5vw,54px);text-transform:uppercase}
.guide-head p{color:var(--muted);max-width:65ch;margin:8px 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.guide{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
.board{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.board .paper{background:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;padding:14px}
.board .cap{border-top:1.5px solid var(--ink);padding:12px 14px;min-height:92px}
.board .cap b{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block}
.board .cap div{font:600 19px/1.25 var(--body);margin-top:2px}
.controls{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;border:1.5px solid var(--ink);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn svg{width:14px;height:14px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font:500 10px var(--mono);cursor:pointer;padding:0}
.dots button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dots button.done{border-color:var(--green)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;transition:border-color .15s}
.step:hover{border-color:var(--muted)}
.step.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.step .n{font:700 28px/1 var(--display);color:var(--muted)}
.step.on .n{color:var(--accent)}
.step h3{font:600 17px/1.3 var(--body);margin:0}
.step p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.step .ref{display:inline-block;margin-top:6px;font:500 12px var(--mono);color:var(--blue)}
.step label{display:flex;align-items:flex-start;padding-top:3px;cursor:pointer}
.step input{width:20px;height:20px;accent-color:var(--green);cursor:pointer}
.step.done h3{text-decoration:line-through;text-decoration-color:var(--green);text-decoration-thickness:2px}

.sec{margin-top:28px}
.sec h2{font-size:26px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:2px;background:var(--ink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.list li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.list li::before{content:"□ ";font-family:var(--mono);color:var(--muted)}
.box-title{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.code-table{width:100%;border-collapse:collapse;font-size:15px}
.code-table td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.code-table td:first-child{font:500 13px var(--mono);color:var(--blue);white-space:nowrap;width:1%}
.safety{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px;border-radius:8px;background:var(--caution-soft);border:1.5px solid var(--caution);margin-top:16px}
.safety svg{width:28px;height:28px}
.safety b{display:block;font:700 18px var(--display);text-transform:uppercase;letter-spacing:.03em}
.safety p{margin:2px 0 0;font-size:15px}
.video{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel)}
.video p{margin:2px 0 0;color:var(--muted);font-size:14px}
.video h3{font:600 18px var(--body)}
.video .acts{display:flex;gap:8px;flex-wrap:wrap}
.region{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.region .rlab{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.region select{font:inherit;font-size:14px;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);max-width:100%}
.region .rhint{font-size:13px;color:var(--muted)}
.local{border:1.5px solid var(--blue);border-radius:8px;background:var(--blue-soft);padding:14px}
.local-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.local-head p{margin:2px 0 0;font-size:14px;color:var(--muted);max-width:60ch}
.local-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lc .kicker{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.lc b{font-weight:600;font-size:15px;line-height:1.3}
.lc a{font-size:14px;overflow-wrap:anywhere}
.safety.warn{background:var(--accent-soft);border-color:var(--accent);margin:0 0 14px}
.code-table th{text-align:left;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--ink)}
.code-table td.lk{white-space:nowrap;font-size:14px;width:1%}
.rail .grp{font:600 15px var(--body);padding:7px 10px 2px;color:var(--ink)}
.rail a.sub{padding-left:22px;font-size:14px;font-weight:400}
.srow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:6px}
.srow .ref{margin-top:0}
.vlink{font:500 12px var(--mono);color:var(--accent);text-decoration:none}
.vlink:hover{text-decoration:underline}
.sphoto{margin:10px 0 0}
.sphoto img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.sphoto figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.sphoto figcaption span{display:block;font-size:11px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.gal figure{margin:0;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
.gal figcaption{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.gal figcaption a{font-size:11px;color:var(--muted);text-decoration:none;overflow-wrap:anywhere}
.gal figcaption a:hover{text-decoration:underline}
.card .thumb.ph{padding:0;position:relative}
.card .thumb.ph img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.card .thumb .mini{position:absolute;right:8px;bottom:8px;width:38%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.finder{margin:0 0 28px;padding:20px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.finder .kicker{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.finder h2{font-size:clamp(26px,3.4vw,36px);text-transform:uppercase;margin:2px 0 12px}
.askform{display:flex;flex-wrap:wrap;gap:8px}
.askform input[type=text]{flex:1 1 280px;min-width:0;padding:12px 14px;font:inherit;font-size:17px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink)}
.askform .btn{padding:10px 16px;font-size:15px}
.btn.cam svg{width:18px;height:18px}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ex .chip{cursor:pointer;font-family:var(--body);font-size:13px;text-decoration:none;color:var(--ink);white-space:normal;text-align:left}
.ex .chip:hover{border-color:var(--ink)}
.ai-note{font-size:13px;color:var(--muted);margin:12px 0 0}
.askcta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border:2px solid var(--accent);border-radius:8px;background:var(--accent-soft);margin-bottom:16px}
.askcta p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.planwait{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px dashed var(--line);border-radius:8px;margin-top:16px;flex-wrap:wrap}
.planwait>div{flex:1;min-width:0}.planwait p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:6px}
.grid.small .card p{display:none}
.plan{margin-top:24px}.plan h1{font-size:clamp(30px,4.4vw,48px);text-transform:uppercase}
.plan .lede{color:var(--muted);max-width:65ch;margin:8px 0 12px}
.qty{font:500 12px var(--mono);color:var(--muted);margin-left:6px}
.slist{margin:4px 0 0;padding-left:18px;font-size:15px}
.olist{margin:4px 0 0;padding-left:22px}.olist li{margin:3px 0}
.idwrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.idimg{width:100%;border-radius:8px;border:1.5px solid var(--ink);max-width:100%}
.idout .kicker{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.idname{font-size:32px;text-transform:uppercase;margin:2px 0 6px}
.buy{font-size:15px;margin-top:12px}
.rail a.navask{border:1.5px solid var(--accent);color:var(--accent);font-weight:600;margin-bottom:6px}
.rail a.navask[aria-current="page"]{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (max-width:700px){.idwrap{grid-template-columns:minmax(0,1fr)}}
.aiset{margin-top:12px;padding:12px;border:1.5px solid var(--blue);border-radius:8px;background:var(--blue-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.keyform{display:flex;flex-direction:column;gap:8px;width:100%}
.keyform label{display:flex;flex-direction:column;gap:2px}.keyform label span{color:var(--muted)}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}.keyrow input{flex:1 1 220px;min-width:0;padding:9px 10px;font:inherit;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.libi{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);min-width:0}
.libi b{font-weight:600;font-size:15px}.libi span{font-size:13px;color:var(--muted)}
.libi.guide{text-decoration:none;color:var(--ink);border-color:var(--ink)}.libi.guide span{color:var(--accent);font-weight:600}
.libi.guide:hover{background:var(--panel2)}
.libact{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.libact .chip{cursor:pointer;text-decoration:none;color:var(--ink);font-family:var(--body)}
.note{font-size:13px;color:var(--muted);margin-top:28px;padding-top:12px;border-top:1px solid var(--line)}

/* scene drawing */
.scene{display:block;width:100%;height:auto}
.scene .o{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene .th{stroke-width:1;opacity:.55}
.scene .d{stroke-dasharray:5 4}
.scene .f{fill:var(--panel2);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.scene .f2{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.scene .bg{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.scene .a{fill:var(--accent);stroke:none}
.scene .ao{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.scene .p{fill:none;stroke:var(--ink);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.scene .pi{fill:none;stroke:var(--panel2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.scene .wb{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.scene .ww{fill:none;stroke:var(--muted);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1 0}
.scene .wg{fill:none;stroke:var(--green);stroke-width:3.5;stroke-linecap:round}
.scene .t{font:500 9px var(--mono);fill:var(--muted)}
.scene .tb{font:700 11px var(--display);fill:var(--ink);letter-spacing:.04em}
.scene g[data-s]{transition:opacity .45s ease}
.scene g.fut{opacity:.07}
.scene g.now .o,.scene g.now .f,.scene g.now .f2{stroke:var(--accent)}
.scene g.now .f,.scene g.now .f2{fill:var(--accent-soft)}
.scene g.now .t,.scene g.now .tb{fill:var(--accent)}
.scene g.now .p{stroke:var(--accent)}
.scene g.now{animation:pop .6s ease}
@keyframes pop{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scene g[data-s]{transition:none}.scene g.now{animation:none}.card{transition:none}}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;max-height:none}
  .rail h4{display:none}

  ['Shut off the water','Turn the shutoff valve behind the toilet clockwise until it stops.'],
  ['Drain the tank','Flush and hold the handle down so the tank empties. Sponge out what’s left around the flush valve.'],
  ['Remove the old flapper','Unhook the chain from the handle arm and slide the flapper’s ears off the pegs on the overflow tube. Take it with you to the store to match the size.'],
  ['Install the new flapper','Clip the new flapper onto the pegs (or slide the ring over the overflow tube) and check that it sits centered on the seat.'],
  ['Set the chain','Hook the chain so it has about ½ in of slack with the flapper closed. Too tight keeps it open; too loose can stop it lifting.'],
  ['Refill and test','Turn the water back on. Put a few drops of food coloring in the tank and wait 30 minutes without flushing. Color in the bowl means it still leaks.'],
 ],
 code:[['Federal (EPAct)','New toilets sold in the U.S. use 1.6 gallons per flush or less; many states and WaterSense models use 1.28. Use the flapper the manufacturer specifies to keep the rated flush volume.'],['IPC 606.2','Each toilet must have its own accessible shutoff valve. If yours won’t close, replace it (see Add a Shutoff Valve).']]},

{id:'toilet-fill-valve',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'fillv',title:'Replace a Toilet Fill Valve',lvl:'Beginner',time:'30–45 min',permit:false,
 blurb:'Fix a toilet that hisses, refills slowly or overflows into the tube by replacing the valve that refills the tank.',
 vq:'how to replace a toilet fill valve',
 tools:['Adjustable wrench or groove-joint pliers','Sponge and bucket','Towel'],
 mats:['Universal anti-siphon fill valve (ASSE 1002 listed)','New supply tube if the old one is braided steel over 5 years old or plastic'],
 safety:'Never overtighten plastic nuts; hand-tight plus a quarter turn is enough, and cracked nuts can flood a floor.',
 steps:[
  ['Shut off and empty the tank','Close the shutoff, flush, and sponge the tank dry.'],
  ['Remove the old valve','Disconnect the supply tube under the tank. Unscrew the lock nut under the tank and lift the old valve out.'],
  ['Set the height','Adjust the new valve so its critical-level mark (CL) is at least 1 in above the top of the overflow tube.','ASSE 1002 / IPC 425.3.1'],
  ['Install and connect','Insert the valve with its gasket, tighten the lock nut hand-tight plus a quarter turn, and clip the refill tube to the overflow tube so it sits above the water line.'],
  ['Set the water level','Turn the water on and adjust the float so water stops ½–1 in below the top of the overflow tube (or at the line marked in the tank).'],
  ['Check for leaks','Look under the tank and at the supply connection; tighten slightly if anything weeps.'],
 ],
 code:[['IPC 425.3.1','Tank fill valves must be anti-siphon (ASSE 1002) with the critical-level mark at least 1 in above the overflow so tank water can’t be siphoned into the drinking water.'],['IPC 606.2','An accessible shutoff valve is required on the toilet supply.']]},

{id:'install-toilet',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'toilet',title:'Install a New Toilet',lvl:'Intermediate',time:'2–3 hrs',permit:'Varies',
 blurb:'Pull the old toilet, check the flange and set a new one with a fresh wax seal so it doesn’t rock or leak.',
 vq:'how to remove and install a toilet',
 tools:['Adjustable wrench','Putty knife','Hacksaw or oscillating tool (for long bolts)','Level','Bucket, sponge and gloves','Tape measure'],
 mats:['Toilet matching your rough-in (usually 12 in from wall to bolt center)','Wax ring (or wax-free seal)','Closet bolts','Supply tube','Shims (plastic)','Silicone or tub-and-tile caulk'],
 safety:'A toilet weighs 60–100 lb. Lift with your legs or get help. Plug the open drain with a rag to block sewer gas while you work.',
 steps:[
  ['Check the flange','Remove the old toilet, scrape off the old wax, and check that the flange is level with or slightly above the finished floor and screwed down solid. Repair a broken flange with a repair ring.','IPC 405.4 — flanges secured to the floor'],
  ['Place the new wax ring','Set the wax ring on the flange (or on the toilet horn), centered.'],
  ['Set the closet bolts','Slide new closet bolts into the flange slots so they point straight up, parallel to the wall.'],
  ['Lower the toilet','Lower the bowl straight down over the bolts in one motion, then press down and rock gently to compress the wax. Don’t lift it again or the seal is ruined.'],
  ['Tighten the nuts','Alternate side to side, a little at a time, until the bowl doesn’t move. Shim if the floor is uneven. Cut off excess bolt length and snap on the caps.'],
  ['Mount the tank and supply','Bolt on the tank if it’s separate, then connect a new supply tube. Turn on the water and check every joint.'],
  ['Caulk the base','Caulk the front and sides to the floor, leaving the back open so a future leak shows up instead of rotting the subfloor.'],
 ],
 code:[['IPC 405.3.1','Toilet center must be at least 15 in from any side wall or obstruction and have at least 21 in of clear space in front.'],['IPC 405.4','Floor flanges must be secured to the building structure; the toilet must be bolted to the flange.'],['Federal (EPAct)','New toilets: 1.6 gallons per flush maximum; check your state for lower limits such as 1.28 gpf.']]},

{id:'faucet-cartridge',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'cartridge',title:'Replace a Faucet Cartridge',lvl:'Beginner',time:'45 min',permit:false,
 blurb:'Fix a dripping single-handle faucet by swapping the cartridge inside it.',
 vq:'how to replace a single handle faucet cartridge',
 tools:['Hex (Allen) keys and screwdrivers','Small flat screwdriver or pick','Groove-joint pliers','Cartridge puller (some Moen models)','Rag'],
 mats:['Replacement cartridge matching the faucet brand and model','Silicone faucet grease'],
 safety:'Plug or cover the drain so small screws and clips can’t fall in.',
 steps:[
  ['Shut off the water','Close the hot and cold shutoffs under the sink and open the faucet to release pressure. Plug the drain.'],
  ['Remove the handle','Pry off the decorative cap, remove the handle screw, and lift off the handle.'],
  ['Remove the retaining nut or clip','Unscrew the bonnet nut or pull the U-shaped retaining clip with pliers. Note how it was installed.'],
  ['Pull the old cartridge','Pull the cartridge straight up. Note which way the stem or tabs faced so the hot and cold sides stay correct.'],
  ['Match the part','Take the old cartridge to the store, or look up the faucet model number, to get the exact replacement.'],
  ['Install the new cartridge','Coat the O-rings with faucet grease, push the cartridge in with the same orientation, and reinstall the clip or nut and the handle.'],
  ['Test','Turn the shutoffs back on, run hot and cold, and check for drips at the spout and under the handle.'],
 ],
 code:[['NSF 61 / 372','Replacement parts that touch drinking water must be certified lead-free.'],['IPC 424.3','If this is a tub or shower valve, the replacement must keep pressure-balance or thermostatic scald protection (ASSE 1016).']]},

{id:'install-faucet',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'faucet',title:'Install a Bathroom Faucet',lvl:'Beginner',time:'1–2 hrs',permit:false,
 blurb:'Swap an old lavatory faucet for a new one, including the supply lines.',
 vq:'how to install a bathroom faucet',
 tools:['Basin wrench','Adjustable wrench','Flashlight','Bucket and towel','Putty knife'],
 mats:['New faucet (check 1-hole, 4 in or 8 in spread)','Two braided supply lines sized to your shutoffs','Plumber’s putty or silicone (if the faucet has no gasket)'],
 safety:'Work under the sink with a light and safety glasses; old corroded fittings can snap and spray.',
 steps:[
  ['Shut off the water','Close both shutoffs and open the faucet to drain the lines.'],
  ['Remove the old faucet','Disconnect the supply lines, use a basin wrench to remove the mounting nuts, and lift the old faucet out. Clean the sink deck.'],
  ['Seal the base','Place the faucet gasket, or a thin bead of putty if there’s no gasket, on the sink deck.'],
  ['Set the faucet','Insert the faucet through the holes and center it.'],
  ['Tighten the mounting nut','From below, tighten the mounting nut by hand, then snug with the basin wrench.'],
  ['Connect the supply lines','Connect hot (left) and cold (right) supply lines from the faucet to the shutoffs. Hand-tight plus a quarter turn.'],
  ['Flush and test','Remove the aerator, run water for a minute to flush debris, reinstall the aerator and check for leaks.'],
 ],
 code:[['IPC 604.4','Lavatory faucets are limited to 2.2 gpm at 60 psi (many states and WaterSense: 1.5 gpm).'],['NSF 61 / 372','Faucets and supply lines must be certified lead-free.'],['IPC 606.2','Hot and cold supplies each need an accessible shutoff valve.']]},

{id:'unclog-drain',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'clog',title:'Unclog a Sink Drain',lvl:'Beginner',time:'30–60 min',permit:false,
 blurb:'Clear a slow or stopped sink with a plunger, then the trap, then a hand snake.',
 vq:'how to unclog a bathroom sink drain',
 tools:['Cup plunger','Bucket','Groove-joint pliers','¼ in hand drain snake (auger)','Rubber gloves and eye protection'],
 mats:['Rags','Replacement slip washers (in case old ones tear)'],
 safety:'If you already poured chemical drain cleaner in, don’t plunge or open the trap: the water can burn skin and eyes. Flush with lots of water first and wear gloves and goggles.',
 steps:[
  ['Skip the chemicals','Chemical cleaners rarely clear hair clogs and make opening the trap dangerous. Start mechanically.'],
  ['Plunge','Remove the pop-up stopper, plug the overflow hole with a wet rag, add 2 in of water, and plunge firmly 10–15 times.'],
  ['Clean the trap','Put a bucket under the trap, loosen the slip nuts, and clean out the trap. Most bathroom clogs are hair right here.'],
  ['Snake the trap arm','If the trap was clear, feed the snake into the trap arm toward the wall, crank it through the clog, and pull the debris back.'],
  ['Reassemble and flush','Reconnect the trap, then run hot water for a minute and check the joints for drips.'],
 ],
 code:[['IPC 708','Cleanouts must stay accessible. Never cover one with drywall or tile.'],['IPC 1002.4','A trap must hold a 2–4 in water seal; reinstall it the same way so sewer gas stays out.']]},

{id:'shutoff-valve',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'shutoff',title:'Add a Fixture Shutoff Valve',lvl:'Intermediate',time:'1 hr',permit:'Varies',
 blurb:'Install a push-fit stop valve under a sink or toilet so you can shut that fixture off without shutting off the house.',
 vq:'how to install a push fit shut off valve',
 tools:['Tubing cutter','Deburring tool','Depth gauge or marker','Bucket and towels'],
 mats:['Push-fit quarter-turn stop valve sized to your pipe (½ in copper, CPVC or PEX)','Supply tube','Escutcheon (trim ring)'],
 safety:'Shut off the main and open a low faucet to drain the line before cutting. Cut pipe can hold a lot of water.',
 steps:[
  ['Shut off the main','Close the main water valve and open the lowest faucet in the house to drain the lines.'],
  ['Cut the pipe square','Cut the stub-out squarely with a tubing cutter, leaving enough length for the valve’s insertion depth. Deburr inside and out.'],
  ['Slide on the escutcheon','Put the trim ring on before the valve.'],
  ['Push on the valve','Mark the insertion depth, then push the valve on firmly until it reaches the mark.','ASSE 1061 — push-fit fittings'],
  ['Connect the supply tube','Connect the fixture supply tube from the valve outlet to the faucet or toilet.'],
  ['Turn the water on slowly','Open the main slowly with the new valve closed, check for leaks, then open the valve.'],
 ],
 code:[['IPC 606.2','Every fixture needs its own accessible shutoff valve on the supply.'],['ASSE 1061','Push-fit fittings must be listed to ASSE 1061 and inserted to the full marked depth.'],['IPC 605','Pipe and fittings must be rated for potable water.']]},

{id:'water-heater',trade:'Plumbing',nk:'plumbing',name:'Plumbing',scene:'heater',title:'Replace an Electric Water Heater',lvl:'Advanced',time:'4–6 hrs',permit:'Yes',
 blurb:'Swap a failing electric tank for a new one with the relief valve, expansion tank and wiring done to code.',
 vq:'how to replace an electric water heater',
 tools:['Voltage tester','Garden hose','Pipe wrenches / tubing cutter','Screwdrivers and wire strippers','Appliance dolly','Level'],
 mats:['Electric water heater (same voltage and wattage, or check circuit)','Water heater connectors or pipe and fittings','T&P discharge pipe (copper, CPVC or PEX rated for it)','Drain pan with drain line','Thermal expansion tank (if there is a check valve or PRV)','Seismic strap kit (where required)','Wire connectors'],
 safety:'Gas water heaters involve gas lines and venting: hire a licensed plumber. For electric, turn off the breaker and test the wires; never power the heater before it is full of water or the elements will burn out in seconds.',
 steps:[
  ['Shut off the power','Turn off the water heater breaker and verify the wires in the heater’s junction box are dead.','NEC 422.31 — disconnect'],
  ['Drain and disconnect','Close the cold supply valve, attach a hose to the drain valve, open a hot faucet, and drain the tank. Disconnect the water lines and wiring.'],
  ['Set the pan and new heater','Place a drain pan piped to a drain or outside where a leak could cause damage, then set the new heater level.','IPC 504.7 — pan where leakage can damage'],
  ['Install the relief valve and discharge pipe','Install the temperature and pressure (T&P) relief valve and run a full-size discharge pipe down to within 6 in of the floor or to an approved drain, with no valve and no threads on the end.','IPC 504.6'],
  ['Connect water lines and expansion tank','Connect cold in and hot out with listed connectors. Add a thermal expansion tank on the cold side if the house has a check valve or pressure-reducing valve.','IPC 607.3'],
  ['Strap the heater','Install two seismic straps (upper and lower third) where required, such as in California.'],
  ['Fill, then power','Open a hot faucet, open the cold supply, and wait until water runs steadily from the faucet. Only then reconnect the wiring, restore the breaker and set the thermostat to 120 °F.'],
 ],
 code:[['IPC 504.4–504.6','A T&P relief valve is required; its discharge pipe must be full size, drain by gravity, end within 6 in of the floor or at an approved receptor, and have no valve or threaded end.'],['IPC 504.7','A drain pan is required where a leak would damage the building.'],['IPC 607.3','Thermal expansion control is required where a check valve or backflow preventer creates a closed system.'],['NEC 422.13','The branch circuit must be rated at least 125% of the heater’s rated current.'],['NEC 422.31','A disconnect must be within sight of the heater or lockable in the off position.'],['Permit','Water heater replacement needs a permit and inspection in most jurisdictions.']]},

{id:'glue-pvc',trade:'Plumbing',nk:'plumbing',name:'Plumbing',base:'pipe',title:'Glue PVC drain pipe',lvl:'Beginner',time:'30 min',permit:'Varies',

  ['Dry fit and mark','Dry-fit all pieces and draw alignment marks across each joint.'],
  ['Prime','Apply purple primer to the outside of the pipe and inside of the fitting.','IPC 705.14.2 — primer required'],
  ['Cement','While the primer is wet, apply cement to both surfaces.'],
  ['Push and twist','Push the pipe in fully with a quarter turn, line up the marks and hold 30 seconds.'],
  ['Let it cure','Wait the cure time on the can before running water (longer in cold weather).']],

{id:'join-cpvc',trade:'Plumbing',nk:'plumbing',name:'Plumbing',base:'pipe',title:'Join CPVC water pipe',lvl:'Beginner',time:'30 min',permit:'Varies',

{id:'glue-abs',trade:'Plumbing',nk:'plumbing',name:'Plumbing',base:'pipe',title:'Glue ABS drain pipe',lvl:'Beginner',time:'30 min',permit:'Varies',

{id:'solder-copper',trade:'Plumbing',nk:'plumbing',name:'Plumbing',base:'pipe',title:'Solder copper pipe',lvl:'Intermediate',time:'45 min',permit:'Varies',

{id:'frozen-pipe',trade:'Plumbing',nk:'plumbing',name:'Plumbing',base:'pipe',title:'Fix a frozen or leaking pipe',lvl:'Beginner',time:'30–60 min',permit:false,

{id:'pex-lines',trade:'Plumbing',nk:'plumbing',name:'Plumbing',base:'pipe',title:'Run new PEX supply lines',lvl:'Intermediate',time:'Half day',permit:'Yes',

 safety:'Work from a stable platform, never from a chair. Turn off power to ceiling fixtures and remove them.',
 steps:[['Snap a guide line','Snap a chalk line parallel to the long wall, one strip width minus ½ in from the wall.'],

  ['Hang with a helper','Unfold along the line while a helper supports the folds with a clean broom.'],
  ['Smooth as you go','Brush from the center outward.'],
  ['Trim at the walls','Trim at the walls with a knife and straightedge.'],
  ['Fixture openings','Cut openings for fixtures after the power is off.']],

{id:'wallpaper-repair',trade:'Wallpaper',name:'Wallpaper',base:'wall',title:'Repair wallpaper seams and bubbles',lvl:'Beginner',time:'30 min',permit:false,

  ['Slit bubbles','Cut a small slit in a bubble along the pattern line.'],

{id:'wallpaper-border',trade:'Wallpaper',name:'Wallpaper',base:'wall',title:'Hang a wallpaper border',lvl:'Beginner',time:'1–2 hrs',permit:false,

{id:'combine-wallpapers',trade:'Wallpaper',name:'Wallpaper',base:'wall',title:'Combine two wallpapers',lvl:'Intermediate',time:'1 day',permit:false,

  ['Mark a level line','Mark a level line at that height around the room.'],

{id:'walls-ceilings',name:'Walls & Ceilings',scene:'wall',title:'Patch a Hole in Drywall',lvl:'Beginner',time:'3 hrs over 2 days',permit:false,

 vq:'how to patch large hole in drywall',
 tools:['Drywall saw','Drill/driver','6 in and 10 in taping knives','Mud pan','Sanding sponge','Square'],
 mats:['Drywall scrap of matching thickness (usually ½ in)','1×3 furring strips','1¼ in drywall screws','Mesh tape','Lightweight joint compound','Primer'],
 safety:'Before cutting, check for wires and pipes. Cut shallow and look inside the hole with a flashlight.',
 steps:[
  ['Square up the hole','Draw a rectangle around the damage and cut it out cleanly with a drywall saw.'],
  ['Install backer cleats','Screw wood strips inside the opening at the top and bottom, half exposed.'],
  ['Screw in the patch','Cut a drywall piece to fit and screw it to the cleats with heads just below the surface.'],
  ['Tape the seams','Apply mesh tape over all four seams.'],
  ['Mud in thin coats','Apply 3 coats, each wider than the last (6, 8, 10 in), and let each dry fully.'],
  ['Sand and prime','Sand lightly, check with a raking flashlight, then prime before painting.'],
 ],
 code:[['IRC R702.3','Gypsum board must be fastened per Table R702.3.5 (typically screws every 12 in on ceilings, 16 in on walls).'],['IRC R302.6','Walls and ceilings between the garage and the house need ½ in gypsum (⅝ in Type X under habitable rooms). Patch with the same type.']]},

{id:'flooring',name:'Flooring',scene:'floor',title:'Install Click-Lock Vinyl Plank',lvl:'Intermediate',time:'1 day per room',permit:false,
 blurb:'A floating floor goes over most existing hard surfaces with no glue or nails.',
 vq:'how to install luxury vinyl plank flooring',
 tools:['Tapping block and pull bar','Rubber mallet','Utility knife and straightedge','Spacers','Undercut / jamb saw','6 ft straightedge'],
 mats:['Vinyl plank (room sq ft + 10% waste)','Underlayment (if not pre-attached)','Transition strips','Floor leveler (if needed)'],
 safety:'Old sheet vinyl and black mastic can contain asbestos. Do not sand or scrape it; float over it or have it tested.',
 steps:[
  ['Check the subfloor','Flatten any high spots and fill low spots so the floor is within 3/16 in over 10 ft (or as the manufacturer specifies).'],
  ['Lay underlayment','Roll out underlayment with seams butted and taped, unless your planks have it attached.'],
  ['Start the first row','Start along the longest straight wall, tongue toward the wall, with spacers leaving an expansion gap.'],
  ['Stagger the seams','Start each new row with the cut-off from the previous one, keeping end joints at least 6 in apart.'],
  ['Fill the room','Angle, click and tap each plank. Rip the last row to width, keeping the expansion gap.'],
  ['Install base and transitions','Remove the spacers and cover the gap with baseboard or quarter-round. Nail it to the wall, never to the floor.'],
 ],
 code:[['Manufacturer','Installation instructions are enforceable as part of the product listing and warranty: follow expansion gaps and maximum run lengths.'],['IRC R302.12','Do not seal off required draftstopping or fireblocking when removing old floors in multi-story framing.']]},

{id:'doors',name:'Doors',scene:'door',title:'Hang a Prehung Interior Door',lvl:'Intermediate',time:'2–3 hrs',permit:false,
 blurb:'Set, shim and plumb a door so it swings freely and latches every time.',
 vq:'how to install prehung interior door',
 tools:['4 ft and 6 ft levels','Finish nailer or hammer and nail set','Utility knife','Drill','Tape measure'],
 mats:['Prehung door unit','Composite shims','2½ in finish nails','3 in screws (hinge side)','Casing trim'],
 safety:'Doors are heavy and awkward. Get a helper to tip the unit into the opening.',
 steps:[
  ['Check the rough opening','It should be the door width + 2 in and the door height + 2½ in, with a level floor.'],
  ['Set the unit','Tip the frame in, centered in the opening and flush with both wall faces.'],
  ['Shim the hinge side plumb','Shim behind each hinge until the hinge jamb is perfectly plumb, then nail through the shims.'],
  ['Close the door and check','Leave the shipping clips on until the hinge side is fixed, then cut them and swing the door.'],
  ['Even the reveal','Shim the latch and head jambs for an even ⅛ in gap all around. Replace one hinge screw per hinge with a 3 in screw into the stud.'],
  ['Install casing','Score off the shims, then nail the casing with a 3/16 in reveal from the jamb edge.'],
 ],
 code:[['IRC R311.2','At least one exterior egress door: 32 in clear width and 78 in high.'],['IRC R302.5.1','A door from the garage into the house must be solid wood, steel 1⅜ in or thicker, or 20-minute rated. Many editions also require self-closing.'],['IRC R308.4','Glass in or next to doors must be safety glazing.']]},

{id:'windows',name:'Windows',scene:'window',title:'Install a Replacement Window',lvl:'Advanced',time:'3–4 hrs per window',permit:'Often',
 blurb:'Fit a new insert window into the existing frame and seal it against air and water.',
 vq:'how to install replacement window insert',
 tools:['Tape measure','Level','Pry bar and putty knife','Drill/driver','Caulk gun','Foam gun'],
 mats:['Replacement window (ordered to smallest measurement minus ¼ in)','Composite shims','Low-expansion window foam','Exterior sealant','Interior trim stops'],
 safety:'Work from inside when possible. On upper floors, never lean out to work; use proper scaffolding or hire out the exterior.',
 steps:[
  ['Measure three times','Measure the width at the top, middle and bottom, and the height at the left, center and right. Use the smallest of each.'],
  ['Remove the old sashes','Pry off the interior stops, remove the sashes and parting beads, and clean out the old frame.'],
  ['Seal the opening','Run a continuous bead of sealant on the exterior blind stop and the sill.'],
  ['Set the new window','Press the unit into the sealant from inside, centered in the opening.'],
  ['Shim, fasten, insulate','Shim at the fastener points until it is level and square (diagonals equal), screw through the jamb, and fill the gaps with low-expansion foam.'],
  ['Trim and caulk','Reinstall the interior stops and caulk the exterior perimeter.'],
 ],
 code:[['IRC R310','Sleeping-room egress: 5.7 sq ft net opening (5.0 on grade floor), 24 in min height, 20 in min width, sill no more than 44 in above floor. Do not reduce an existing egress opening.'],['IRC R308.4','Safety glass is required near doors, tubs and showers, and in large low panes.'],['IECC / IRC N1102','The new window must meet the U-factor for your climate zone.'],['IRC R312.2','Window-opening control is required where the sill is under 24 in and more than 72 in above outside grade.']]},

{id:'cabinets',name:'Cabinets',scene:'cab',title:'Install Kitchen Cabinets',lvl:'Advanced',time:'1–2 days',permit:false,
 blurb:'Hang the uppers first, then set level base cabinets ready for countertops.',
 vq:'how to install kitchen cabinets diy',

 mats:['Cabinets','2½ in cabinet screws','Shims','1×4 ledger board','Filler strips'],
 safety:'Wall cabinets loaded with dishes weigh hundreds of pounds. Screw into studs only, never into drywall anchors.',
 steps:[
  ['Mark level reference lines','Find the floor high point. From it, mark 34½ in for the base tops and 54 in for the bottoms of the uppers.'],
  ['Locate studs','Mark every stud center above and below the lines.'],
  ['Screw on a ledger','Screw a straight 1×4 temporarily to the studs along the 54 in line to rest the uppers on.'],
  ['Hang the uppers','Start in the corner. Rest each cabinet on the ledger and screw it through the hanging rail into the studs.'],
  ['Set the bases','Starting in the corner, shim each base to level front-to-back and side-to-side, then screw it to the studs.'],
  ['Join face frames','Clamp neighboring cabinets flush, pre-drill, and screw the face frames together.'],
 ],
 code:[['IRC M1901 / listing','Keep about 30 in between a cooktop and unprotected cabinets above it (24 in with protection, if the range listing allows).'],['NEC 210.52(C)','Plan countertop receptacles before the bases go in (see Countertops).']]},

{id:'countertops',name:'Countertops',scene:'counter',title:'Install a Butcher-Block Countertop',lvl:'Intermediate',time:'1 day + finish cure',permit:false,

  ['Cut the sink opening','Trace the sink template, drill corner holes, and cut with a jigsaw.'],

 ],

{id:'shelving',name:'Shelving',scene:'shelf',title:'Mount Heavy-Duty Wall Shelves',lvl:'Beginner',time:'1 hr',permit:false,

 ],

{id:'exterior',name:'Exterior',scene:'deck',title:'Replace a Rotted Deck Board',lvl:'Beginner',time:'1–2 hrs',permit:false,
 blurb:'Swap out soft or split boards before someone puts a foot through them.',
 vq:'how to replace deck boards',
 tools:['Pry bar / cat\'s paw','Drill/driver','Circular saw','Awl or screwdriver (probing)','Speed square'],
 mats:['Pressure-treated or composite deck board','Coated or stainless deck screws','End-cut preservative'],
 safety:'If joists, beams or the ledger are soft, stop. Structural rot needs a full repair or a professional.',
 steps:[
  ['Identify the bad board','Look for boards that are soft, split or cupped, or that flex when you step on them.'],
  ['Remove it','Back out the screws or pry up the nails and lift the board off.'],
  ['Probe the joists','Push an awl into the tops of the exposed joists. If it sinks more than ⅛ in, the joist needs repair.'],
  ['Cut and set the new board','Cut to length with ends centered on joists. Place it bark side (crown) up.'],
  ['Fasten','Drive 2 screws per joist, ¾ in from the edges, using fasteners rated for treated lumber.'],
  ['Gap and seal','Keep about ⅛ in between boards for drainage and brush preservative on cut ends.'],
 ],
 code:[['IRC R317.3','Fasteners in treated lumber must be hot-dip galvanized, stainless steel, silicon bronze or copper.'],['IRC R507','Deck board span limits (typically 16 in o.c. for 5/4 boards, 12 in when run diagonally).'],['IRC R312','Guards are required where the deck is more than 30 in above grade: 36 in high, with openings that will not pass a 4 in sphere.']]},

{id:'heating',name:'Heating',scene:'heat',title:'Install a Programmable Thermostat',lvl:'Beginner',time:'45 min',permit:false,

 safety:'Only for low-voltage (24 V) systems. If the old thermostat has thick wires labeled 120/240 V (baseboard heat), it needs a line-voltage model.',

 ],

{id:'ventilation',name:'Ventilation',scene:'vent',title:'Replace a Bathroom Exhaust Fan',lvl:'Intermediate',time:'2–3 hrs',permit:'Often',

  ['Terminate outdoors','Connect to a roof or wall cap with a backdraft damper. Never stop in the attic or at a soffit vent.'],

 ],

{id:'structure',name:'Structure',scene:'frame',title:'Frame a Non-Load-Bearing Wall',lvl:'Advanced',time:'1 day',permit:'Yes',

let SDK=null;
async function apiJson(prompt,{images,signal,schema},proxy){
  const key=getKey(); if(!proxy&&!key) throw{code:'no_key'};
  if(!SDK) SDK=(await import('./vendor/anthropic.mjs')).default;
  const client=new SDK({apiKey:proxy?'via-proxy':key,baseURL:proxy||undefined,dangerouslyAllowBrowser:true,maxRetries:1});
  const content=[];
  for(const img of images||[]) content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toJpegB64(img)}});
  content.push({type:'text',text:prompt});
  let r;
  try{
    r=await client.beta.messages.create({
      model:'claude-opus-5-5',max_tokens:16000,
      betas:['server-side-fallback-2026-07-01'],fallbacks:'default',
      output_config:{effort:'medium',...(schema?{format:{type:'json_schema',schema}}:{})},
      messages:[{role:'user',content}]},{signal});
  }catch(e){
    if(e instanceof SDK.APIUserAbortError||(signal&&signal.aborted)) throw{code:'cancelled'};
    if(e instanceof SDK.AuthenticationError||e instanceof SDK.PermissionDeniedError) throw{code:'bad_key'};
    if(e instanceof SDK.RateLimitError) throw{code:'rate_limited'};
    if(e instanceof SDK.APIConnectionError) throw{code:'network'};
    throw{code:'upstream_error',message:String(e&&e.message||e)};
  }
  if(r.stop_reason==='refusal') throw{code:'refused'};
  if(r.stop_reason==='max_tokens') throw{code:'invalid_json'};
  const text=r.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  try{return JSON.parse(text)}catch(e){throw{code:'invalid_json'}}
}
async function toJpegB64(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
  if(!bmp) throw{code:'image_rejected'};
  const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
  const buf=new Uint8Array(await blob.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return btoa(bin);
}

  $('#stopai').onclick=()=>ctl.abort();
  if(!AI){box.querySelector('.planwait').innerHTML='<div><b>The planner is not available here.</b><p>The ready-made guides above still work.</p></div>';return}
  const prompt=`You are a licensed general contractor and code inspector writing a do-it-yourself plan for a homeowner.
Project request: "${q.slice(0,500)}"
${regionBrief()}
Follow the codes in force for this region (cite real section numbers from the model code the region uses; if unsure of a number, cite the chapter, not an invented section). Be specific: sizes, spacing, wire gauges, fastener types, torque, cure times. Give 6-10 steps in order. If the request is unsafe or not legal for a homeowner in this region, say so in stopFirst and still explain what the homeowner can prepare and what the pro does.
Reply with ONLY one JSON object of this shape:
${PLAN_SHAPE}`;
  try{
    const p=await AI.json(prompt,{signal:ctl.signal,cache:{gcTime:3600000},schema:PLAN_SCHEMA});
    if(!p||!Array.isArray(p.steps)) throw {code:'invalid_json'};
    box.querySelector('.planwait').outerHTML=renderPlan(p);
    wirePlan(box,p);
  }catch(e){
    const msg={no_key:'Add your Claude API key above to turn on the AI features.',bad_key:'That API key was not accepted. Check it, or remove it and paste a new one.',network:'Could not reach Claude. Check your connection and try again.',cancelled:'Stopped.',not_granted:'Claude was not allowed for this page, so custom plans are off. The ready-made guides still work.',rate_limited:'Too many requests right now. Try again in a minute.',refused:'Claude could not write a plan for that request. Try describing the project differently.',invalid_json:'The plan came back incomplete. Try again.',sampling_disabled:'Claude is not available for this account.'}[e&&e.code]||'Something went wrong while writing the plan. Try again.';
    const w=box.querySelector('.planwait'); if(w) w.innerHTML=`<div><b>${msg}</b></div><button class="btn" type="button" data-ask="${esc(q)}">Try again</button>`;
  }
}
const L1=v=>Array.isArray(v)?v.filter(Boolean).map(x=>typeof x==='string'?x:JSON.stringify(x)):[];
function renderPlan(p){
  const steps=Array.isArray(p.steps)?p.steps:[];
  return `<article class="plan">
   <div class="crumb">Custom plan · ${esc(where())}</div>
   <h1>${esc(p.title||'Your project plan')}</h1><p class="lede">${esc(p.summary||'')}</p>
   <div class="meta"><span class="chip">${esc(p.difficulty||'')}</span><span class="chip">⏱ ${esc(p.time||'')}</span><span class="chip${p.permit==='Usually not'?'':' permit'}">Permit: ${esc(p.permit||'Check locally')}</span></div>
   ${p.stopFirst?`<div class="safety warn" style="margin-top:14px"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="var(--accent)"/><path d="M14 7v9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="14" cy="20.5" r="1.7" fill="#fff"/></svg><div><b>Read this first</b><p>${esc(p.stopFirst)}</p></div></div>`:''}
   <section class="sec"><h2>Tools &amp; materials</h2><div class="cols">
    <div><div class="box-title">Tools</div><ul class="list">${L1(p.tools).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div><div class="box-title">Materials</div><ul class="list">${(Array.isArray(p.materials)?p.materials:[]).map(m=>`<li>${esc(m.item||m)}${m.qty?` <span class="qty">${esc(m.qty)}</span>`:''}</li>`).join('')}</ul></div></div></section>
   <div class="safety"><svg viewBox="0 0 28 28"><path d="M14 2 27 25H1z" fill="var(--caution)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 10v7" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="21" r="1.6" fill="var(--ink)"/></svg>
    <div><b>Safety</b><ul class="slist">${L1(p.safety).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
   <section class="sec"><h2>Step by step</h2><ol class="steps">${steps.map((st,i)=>`
    <li class="step"><span class="n">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(st.title||'')}</h3><p>${esc(st.detail||'')}</p>
     <div class="srow">${st.code?`<span class="ref">§ ${esc(st.code)}</span>`:''}<a class="vlink" href="${yt((p.title||'')+' '+(st.title||''))}" target="_blank" rel="noopener">▶ Watch this step</a></div></div>
     <label title="Mark done"><input type="checkbox" aria-label="Mark step ${i+1} done"></label></li>`).join('')}</ol></section>
   <section class="sec"><h2>Video guides</h2><div class="video"><div><h3>Watch it done: ${esc(p.title||'')}</h3><p>Opens a YouTube search in a new tab.</p></div><div class="acts"><a class="btn primary" href="${yt(p.video||p.title||'')}" target="_blank" rel="noopener">Watch videos</a></div></div></section>
   <section class="sec"><h2>Meeting code</h2>
    <div style="overflow-x:auto"><table class="code-table"><thead><tr><th>Section</th><th>Requirement</th><th>Your code</th></tr></thead>${(Array.isArray(p.codes)?p.codes:[]).map(c=>`<tr><td>${esc(c.ref||'')}</td><td>${esc(c.text||'')}</td><td class="lk">${refLink(String(c.ref||''))||`<a href="${gs((c.ref||'')+' '+where())}" target="_blank" rel="noopener">Look up ↗</a>`}</td></tr>`).join('')}</table></div>
    ${L1(p.inspect).length?`<div class="box-title" style="margin-top:14px">What the inspector checks</div><ul class="list">${L1(p.inspect).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
   </section>
   <p class="note">This plan was written by AI for ${esc(where())}. Section numbers can be wrong or out of date. Confirm them with the code links above and your building department before you start.</p>
  </article>`;
}
function wirePlan(box,p){box.querySelectorAll('.plan .step input').forEach(i=>i.onchange=()=>i.closest('.step').classList.toggle('done',i.checked))}

const ID_SHAPE=`{"kind":"tool"|"device"|"material"|"fixture"|"remodel idea"|"problem"|"unknown","name":string,"confidence":"high"|"medium"|"low",
"whatItIs":string (2 sentences),"details":[string] (specs or identifying features visible: brand/model if readable, size, rating),
"howToUse":[string] (short ordered steps, or how to fix/build it if a problem or remodel idea),"safety":[string],"codeNotes":[string] (relevant code rules for the region),
"projects":[string] (3-5 DIY project requests this photo suggests, phrased like "How to ..."),"buyTips":string}`;
async function runIdentify(file,q,box){
  ctl?.abort(); ctl=new AbortController();
  const url=URL.createObjectURL(file);
  box.innerHTML=`<div class="idwrap"><img class="idimg" src="${url}" alt="Your photo"><div class="idout"><div class="planwait"><span class="spin"></span><div><b>Looking at your photo…</b><p>Identifying it and finding related projects.</p></div><button class="btn" id="stopai" type="button">Stop</button></div></div></div>`;
  $('#stopai').onclick=()=>ctl.abort();
  if(!AI){box.querySelector('.planwait').innerHTML='<div><b>Photo search is not available here.</b></div>';return}
  const prompt=`The homeowner took this photo with a home-improvement app.${q?` Their question: "${q.slice(0,300)}".`:''} Identify the main tool, device, building material, fixture, remodel idea or problem shown. ${regionBrief()}
If it is a problem (leak, crack, rot, scorched outlet, mold), say how serious it is and whether to call a pro in safety. Reply with ONLY one JSON object of this shape:
${ID_SHAPE}`;
  try{
    const r=await AI.json(prompt,{images:[file],signal:ctl.signal,schema:ID_SCHEMA});
    const out=box.querySelector('.idout');
    out.innerHTML=`<span class="kicker">${esc(r.kind||'')} · ${esc(r.confidence||'')} confidence</span><h2 class="idname">${esc(r.name||'Not sure')}</h2><p>${esc(r.whatItIs||'')}</p>
     ${L1(r.details).length?`<div class="box-title">What I can see</div><ul class="list">${L1(r.details).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
     ${L1(r.howToUse).length?`<div class="box-title" style="margin-top:12px">How to use it / fix it</div><ol class="olist">${L1(r.howToUse).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
     ${L1(r.safety).length?`<div class="safety" style="margin-top:12px"><svg viewBox="0 0 28 28"><path d="M14 2 27 25H1z" fill="var(--caution)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 10v7" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="21" r="1.6" fill="var(--ink)"/></svg><div><b>Safety</b><ul class="slist">${L1(r.safety).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:''}
     ${L1(r.codeNotes).length?`<div class="box-title" style="margin-top:12px">Code notes for ${esc(where())}</div><ul class="list">${L1(r.codeNotes).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
     ${r.buyTips?`<p class="buy"><b>Buying tip:</b> ${esc(r.buyTips)}</p>`:''}
     <div class="box-title" style="margin-top:12px">Projects you can plan from this</div>
     <div class="ex">${L1(r.projects).map(x=>`<button type="button" class="chip" data-ask="${esc(x)}">${esc(x)} →</button>`).join('')}<a class="chip" href="${yt(r.name||'')}" target="_blank" rel="noopener">▶ Videos about ${esc(r.name||'this')}</a></div>`;
    const loc=match((r.name||'')+' '+L1(r.projects).join(' ')).slice(0,3);
    if(loc.length) box.insertAdjacentHTML('beforeend',`<div class="box-title" style="margin-top:20px">Ready-made guides that match</div><div class="grid small">${loc.map(cardHtml).join('')}</div>`);
  }catch(e){
    const msg={no_key:'Add your Claude API key above to turn on the AI features.',bad_key:'That API key was not accepted. Check it, or remove it and paste a new one.',network:'Could not reach Claude. Check your connection and try again.',cancelled:'Stopped.',not_granted:'Claude was not allowed for this page, so photo search is off.',image_rejected:'That photo could not be read. Try a JPEG or PNG under 20 MB.',images_unavailable:'Photo search is not available in this view.',rate_limited:'Too many requests right now. Try again in a minute.'}[e&&e.code]||'Something went wrong. Try another photo.';
    const w=box.querySelector('.planwait'); if(w) w.innerHTML=`<div><b>${msg}</b></div>`;
  }
}
function finder(){
  stop();
  $('#view').innerHTML=`<div class="crumb"><a href="#home">All trades</a> / Project Finder</div>${launcher(pendingAsk)}<div id="result" class="result"></div>`;
  wireLauncher(); nav('ask');
  const box=$('#result');
  if(pendingImg){const f=pendingImg;pendingImg=null;runIdentify(f,pendingAsk,box)}
  else if(pendingAsk){runPlan(pendingAsk,box)}
  else box.innerHTML=`<section class="sec"><h2>Browse projects</h2>${Object.keys(LIB).map(tr=>`<div class="box-title" style="margin-top:14px">${tr}</div>${libList(tr)}`).join('')}</section>`;
  scrollTo(0,0);
}

function guide(t){
  stop(); cur=0;
  const d=done[t.id]||[];
  $('#view').innerHTML=`
  <div class="crumb"><a href="#home">All trades</a> / ${t.name}</div>
  <div class="guide-head"><h1>${t.title}</h1><p>${t.blurb}</p>
   <div class="meta"><span class="chip">${t.lvl}</span><span class="chip">⏱ ${t.time}</span>${permitChip(t.permit)}<span class="chip code">${t.code.length} code checks</span><span class="chip">Region: ${esc(where())}</span></div>${topNote(t)}</div>
  ${gallery(t)}
  <div class="guide">
   <div class="board" aria-live="polite">
     <div class="paper" id="art">${svgOf(t)}</div>
     <div class="cap"><b id="capn"></b><div id="capt"></div></div>
     <div class="controls">
       <button class="btn" id="prev" aria-label="Previous step"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2 4 7l5 5"/></svg></button>
       <button class="btn primary" id="play"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg><span>Play walkthrough</span></button>
       <button class="btn" id="next" aria-label="Next step"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 2 5 5-5 5"/></svg></button>
       <div class="dots" id="dots">${t.steps.map((s,i)=>`<button data-i="${i}" aria-label="Step ${i+1}">${i+1}</button>`).join('')}</div>
     </div>
   </div>
   <div>
    <ol class="steps" id="steps">${t.steps.map((s,i)=>`
      <li class="step${d[i]?' done':''}" data-i="${i}">
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <div><h3>${s[0]}</h3><p>${s[1]}</p>${s[3]&&s[3].photo?`<figure class="sphoto"><img src="${s[3].photo}" alt="${esc(s[0])}" loading="lazy"><figcaption>${s[3].cap||''} <span>Photo: ${s[3].credit}</span></figcaption></figure>`:''}<div class="srow">${s[2]?`<span class="ref">§ ${s[2]}</span>`:''}<a class="vlink" href="${yt((s[3]&&s[3].vq)||(t.title+' '+s[0]))}" target="_blank" rel="noopener">▶ Watch this step</a></div></div>
        <label for="ck-${t.id}-${i}" title="Mark done"><input type="checkbox" id="ck-${t.id}-${i}" data-i="${i}" ${d[i]?'checked':''} aria-label="Mark step ${i+1} done"></label>
      </li>`).join('')}</ol>
    <div class="safety"><svg viewBox="0 0 28 28"><path d="M14 2 27 25H1z" fill="var(--caution)" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 10v7" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="21" r="1.6" fill="var(--ink)"/></svg>
      <div><b>Safety first</b><p>${t.safety}</p></div></div>
   </div>
  </div>

  <section class="sec"><h2>Video guides</h2>
   <div class="video"><div><h3>Watch it done: ${t.title}</h3><p>Opens a curated YouTube search in a new tab. Use the step numbers above to follow along, and pause each video at the matching step.</p></div>
    <div class="acts"><a class="btn primary" href="${yt(t.vq)}" target="_blank" rel="noopener"><svg viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg>Watch videos</a>
    <a class="btn" href="${yt(t.vq+' code requirements')}" target="_blank" rel="noopener">Code explainers</a></div></div>
  </section>

  <section class="sec"><h2>Tools &amp; materials</h2>
   <div class="cols"><div><div class="box-title">Tools</div><ul class="list">${t.tools.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
   <div><div class="box-title">Materials</div><ul class="list">${t.mats.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
  </section>

  ${LIB[t.trade||t.name]?`<section class="sec"><h2>More ${t.trade||t.name} projects</h2>${libList(t.trade||t.name,t.id)}</section>`:''}
  <section class="sec"><h2>Meeting code</h2>
   ${localCode(t)}
   <div style="overflow-x:auto;margin-top:16px"><table class="code-table"><thead><tr><th>Section</th><th>Requirement</th><th>Your code</th></tr></thead>${t.code.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td class="lk">${refLink(c[0])}</td></tr>`).join('')}</table></div>
  </section>
  <p class="note">Section references follow the 2021 International Residential Code (IRC), 2021 International Plumbing Code (IPC), and 2023 National Electrical Code (NEC). Your state, province or city may adopt different editions or local amendments. Call your building department before you start, and get a permit and inspection where required.</p>`;

  const go=i=>{cur=(i+t.steps.length)%t.steps.length;paint(t)};
  $('#prev').onclick=()=>{stop();go(cur-1)};
  $('#next').onclick=()=>{stop();go(cur+1)};
  $('#play').onclick=()=>timer?stop():play(t);
  $('#dots').onclick=e=>{const b=e.target.closest('button');if(b){stop();go(+b.dataset.i)}};
  $('#steps').addEventListener('click',e=>{
    if(e.target.matches('input')){const i=+e.target.dataset.i;(done[t.id]=done[t.id]||[])[i]=e.target.checked;store.set('lp-done',done);
      e.target.closest('.step').classList.toggle('done',e.target.checked);paint(t);nav(t.id);return}
    if(e.target.closest('label'))return;
    const li=e.target.closest('.step'); if(li){stop();go(+li.dataset.i); if(innerWidth<900) $('.board').scrollIntoView({behavior:'smooth',block:'start'})}
  });
  $('#chg').onclick=()=>{scrollTo({top:0,behavior:'smooth'});$('#rc').focus()};
  paint(t); nav(t.id); scrollTo(0,0);
}

function paint(t){
  document.querySelectorAll('#art g[data-s]').forEach(g=>{const n=+g.dataset.s-1;g.classList.toggle('fut',n>cur);g.classList.toggle('now',n===cur)});
  $('#capn').textContent=`Step ${cur+1} of ${t.steps.length}`;
  $('#capt').textContent=t.steps[cur][0];
  const d=done[t.id]||[];
  document.querySelectorAll('#dots button').forEach((b,i)=>{b.classList.toggle('on',i===cur);b.classList.toggle('done',!!d[i])});
  document.querySelectorAll('#steps .step').forEach((li,i)=>li.classList.toggle('on',i===cur));
}
function play(t){
  $('#play span').textContent='Pause';
  timer=setInterval(()=>{ if(cur>=t.steps.length-1){stop();return} cur++; paint(t)},3200);
}
function stop(){ if(timer){clearInterval(timer);timer=null} const s=$('#play span'); if(s) s.textContent='Play walkthrough'}

function route(){
  const id=location.hash.slice(1); const t=D.find(x=>x.id===id);
  if(id==='ask'){ctl?.abort();finder();return}
  ctl?.abort();
  if(t){$('#q').value='';guide(t);return}
  if(id.startsWith('t-')){const tr=TRADES().find(x=>'t-'+slug(x)===id);if(tr){$('#q').value='';tradePage(tr);return}}
  home($('#q').value);
}
$('#q').addEventListener('input',e=>{ if(location.hash&&location.hash!=='#home'){history.replaceState(null,'','#home')} home(e.target.value)});
addEventListener('hashchange',route);
regionBar();
route();
</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
